spring.application.name=grots-orders
spring.main.banner-mode=off
spring.threads.virtual.enabled=true

server.port=${PORT:8082}

# The OpenAPI document, which the documentation page at the root of the service shows (see OpenApiConfig)
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/openapi.json

# Downstream services (see docs/service-contract.md)
downstream.menu-url=${MENU_URL:http://localhost:8081}
downstream.checkout-url=${CHECKOUT_URL:http://localhost:8083}
downstream.delivery-url=${DELIVERY_URL:http://localhost:8084}
downstream.connect-timeout=2s
downstream.read-timeout=10s

# Service-to-service security (see docs/service-contract.md). JWT_SIGNING_KEY is required (>= 32 bytes).
jwt.signing-key=${JWT_SIGNING_KEY:}
jwt.issuer=${JWT_ISSUER:grots-web}
jwt.audience=${JWT_AUDIENCE:grots-pizzeria}
