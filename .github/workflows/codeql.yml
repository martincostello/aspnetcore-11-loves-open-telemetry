name: codeql

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '0 6 * * MON'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: CodeQL (${{ matrix.language }})
    if: ${{ vars.CODEQL_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      actions: read # only needed for private or internal repositories
      contents: read # only needed for private or internal repositories
      security-events: write # to upload the SARIF results to code scanning

    strategy:
      fail-fast: false
      matrix:
        language: [ 'actions', 'csharp', 'go', 'java', 'javascript', 'python' ]

    steps:

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        languages: ${{ matrix.language }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        category: '/language:${{ matrix.language }}'

  codeql:
    name: codeql
    if: ${{ !cancelled() }}
    needs: [ analysis ]
    runs-on: ubuntu-latest

    steps:
    - name: Report status
      shell: bash
      env:
        SCAN_SUCCESS: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
      run: |
        if [ "${SCAN_SUCCESS}" == "true" ]
        then
          echo 'CodeQL analysis successful ✅'
        else
          echo 'CodeQL analysis failed ❌'
          exit 1
        fi
