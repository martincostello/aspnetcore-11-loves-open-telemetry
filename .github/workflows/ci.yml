name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  JWT_SIGNING_KEY: ci-only-signing-key-0123456789-0123456789

jobs:
  dotnet:
    name: .NET (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0

      - name: Build
        run: dotnet build GrotsPizzeria.slnx --configuration Release

  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    defaults:
      run:
        working-directory: services/delivery

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: services/delivery/go.mod
          cache-dependency-path: services/delivery/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          working-directory: services/delivery

      - name: Build
        run: go build ./...

  java:
    name: Java
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    defaults:
      run:
        working-directory: services/orders

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Lint
        run: sh ./mvnw --batch-mode --no-transfer-progress compile pmd:check

      - name: Build and test
        run: sh ./mvnw --batch-mode --no-transfer-progress verify

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint -- --max-warnings 0

      - name: Lint CSS
        run: npm run lint:css -- --max-warnings 0

      - name: Lint Markdown
        run: npm run lint:md

  node:
    name: Node.js
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    defaults:
      run:
        working-directory: services/menu

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: services/menu/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    defaults:
      run:
        working-directory: services/checkout

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: services/checkout/requirements*.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Add actionlint problem matcher
        run: echo "::add-matcher::.github/actionlint-matcher.json"

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  zizmor:
    name: Audit workflows
    if: ${{ vars.ZIZMOR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      actions: read # only needed for private or internal repositories
      contents: read # only needed for private or internal repositories
      security-events: write # to upload the SARIF results to code scanning

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.8.0

  validate:
    name: Validate configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Validate Docker Compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.weaver.yml config --quiet

      - name: Validate Grafana dashboard
        run: |
          python3 - <<'PY'
          import glob, json
          for path in glob.glob("deploy/grafana/dashboards/*.json"):
              dashboard = json.load(open(path, encoding="utf-8"))
              assert dashboard["uid"] and dashboard["panels"], path
              print(f"{path}: {len(dashboard['panels'])} panels")
          PY

      - name: Validate the API documentation pages are the same
        shell: pwsh
        run: ./build.ps1 -Only docs

      - name: Validate Weaver registry
        run: docker run --rm --volume "$PWD/weaver/registry:/registry:ro" otel/weaver:v0.28.0 registry check --registry /registry

  end-to-end:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0

      - name: Build
        run: dotnet build tests/GrotsPizzeria.EndToEndTests --configuration Release

      - name: Install Chromium
        shell: pwsh
        run: tests/GrotsPizzeria.EndToEndTests/bin/Release/net11.0/playwright.ps1 install --with-deps chromium

      - name: Test
        run: dotnet test --project tests/GrotsPizzeria.EndToEndTests --configuration Release --no-build

  ci:
    name: ci
    needs: [
      actionlint,
      dotnet,
      end-to-end,
      go,
      java,
      javascript,
      node,
      python,
      validate,
      zizmor
      ]
    if: ${{ !cancelled() }}
    env:
      TESTS_SUCCESS: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-slim
    steps:
    - run: |
        if [ "$TESTS_SUCCESS" == "true" ]
        then
          echo 'Integration tests successful ✅'
        else
          echo 'Integration tests failed ❌'
          exit 1
        fi
